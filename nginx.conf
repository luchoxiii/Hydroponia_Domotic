# ==============================================================================
# 🌱 HydroControl - Configuración de Producción para Nginx (Reverse Proxy)
# ==============================================================================
# Colocar en /etc/nginx/sites-available/hydrocontrol y enlazar a sites-enabled

# Límite de tasa para endpoints IoT (evita DoS accidental por microcontroladores)
limit_req_zone $binary_remote_addr zone=iot_limit:10m rate=30r/s;

upstream hydrocontrol_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name tu-dominio-invernadero.com www.tu-dominio-invernadero.com;

    # Redirección obligatoria a HTTPS en producción (descomentar al tener SSL)
    # return 301 https://$host$request_uri;

    # Tamaño máximo para cargas masivas de datasets CSV
    client_max_body_size 25M;

    # Compresión gzip para telemetría y dashboards
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    # Archivos estáticos con caché agresiva del navegador
    location /static/ {
        alias /var/www/hydrocontrol/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Endpoint de telemetría IoT con rate limiting
    location /api/v1/ {
        limit_req zone=iot_limit burst=50 nodelay;
        proxy_pass http://hydrocontrol_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Resto de la aplicación web y APIs
    location / {
        proxy_pass http://hydrocontrol_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # Logs de acceso y error
    access_log /var/log/nginx/hydrocontrol_access.log;
    error_log /var/log/nginx/hydrocontrol_error.log warn;
}
