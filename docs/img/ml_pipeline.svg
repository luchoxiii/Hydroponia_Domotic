<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <text x="500" y="45" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">PIPELINE DE MACHINE LEARNING AGRONÓMICO</text>
  <text x="500" y="70" fill="#94a3b8" font-size="13" text-anchor="middle">Inferencia predictiva multicriterio en &lt;30ms con Random Forest &amp; Isolation Forest</text>

  <!-- Step 1: Ingestion -->
  <rect x="40" y="110" width="200" height="320" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="110" width="200" height="42" rx="12" fill="#0369a1"/>
  <text x="140" y="137" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">1. VARIABLES DE ENTRADA</text>

  <text x="60" y="180" fill="#bae6fd" font-size="11" font-weight="600">📡 Sensores Invernadero:</text>
  <text x="60" y="200" fill="#94a3b8" font-size="11">• pH de la solución</text>
  <text x="60" y="220" fill="#94a3b8" font-size="11">• EC Conductividad (mS)</text>
  <text x="60" y="240" fill="#94a3b8" font-size="11">• Temp. agua (°C)</text>
  <text x="60" y="260" fill="#94a3b8" font-size="11">• Humedad relativa (%)</text>
  <text x="60" y="280" fill="#94a3b8" font-size="11">• Nivel de tanque (%)</text>
  <text x="60" y="300" fill="#94a3b8" font-size="11">• Horas de fotoperiodo</text>

  <text x="60" y="335" fill="#bae6fd" font-size="11" font-weight="600">🌦️ Satelital Open-Meteo:</text>
  <text x="60" y="355" fill="#94a3b8" font-size="11">• Temp. exterior</text>
  <text x="60" y="375" fill="#94a3b8" font-size="11">• Humedad exterior</text>
  <text x="60" y="395" fill="#94a3b8" font-size="11">• Presión de vapor VPD</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="240" y1="270" x2="280" y2="270" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4"/>
  <polygon points="280,265 290,270 280,275" fill="#38bdf8"/>

  <!-- Step 2: Normalization & Preprocessing -->
  <rect x="290" y="110" width="200" height="320" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="290" y="110" width="200" height="42" rx="12" fill="#4338ca"/>
  <text x="390" y="137" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">2. PREPROCESAMIENTO</text>

  <text x="310" y="180" fill="#c7d2fe" font-size="11" font-weight="600">⚙️ Feature Engineering:</text>
  <text x="310" y="205" fill="#94a3b8" font-size="11">• ΔT (Temp Int - Ext)</text>
  <text x="310" y="228" fill="#94a3b8" font-size="11">• ΔH (Hum Int - Ext)</text>
  <text x="310" y="251" fill="#94a3b8" font-size="11">• Normalización Z-score</text>
  <text x="310" y="274" fill="#94a3b8" font-size="11">• Imputación de nulos</text>
  <text x="310" y="297" fill="#94a3b8" font-size="11">• Validación de límites</text>

  <rect x="305" y="330" width="170" height="75" rx="8" fill="#0f172a"/>
  <text x="320" y="355" fill="#a5b4fc" font-size="11" font-weight="700">⚡ Memoria RAM Cache</text>
  <text x="320" y="375" fill="#94a3b8" font-size="10">Estimador pre-cargado</text>
  <text x="320" y="392" fill="#10b981" font-size="10" font-weight="600">Inferencia &lt; 30 ms</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="490" y1="270" x2="530" y2="270" stroke="#818cf8" stroke-width="3" stroke-dasharray="4"/>
  <polygon points="530,265 540,270 530,275" fill="#818cf8"/>

  <!-- Step 3: Ensemble ML Models -->
  <rect x="540" y="110" width="200" height="320" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="540" y="110" width="200" height="42" rx="12" fill="#7e22ce"/>
  <text x="640" y="137" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">3. MODELOS ENSEMBLE</text>

  <rect x="555" y="170" width="170" height="100" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
  <text x="568" y="195" fill="#d8b4fe" font-size="11" font-weight="700">🌲 Random Forest (100)</text>
  <text x="568" y="215" fill="#94a3b8" font-size="10">• Clasificación fisiológica</text>
  <text x="568" y="232" fill="#94a3b8" font-size="10">• Vector de probabilidades</text>
  <text x="568" y="249" fill="#10b981" font-size="10" font-weight="600">• Accuracy: 98.4%</text>

  <rect x="555" y="285" width="170" height="120" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
  <text x="568" y="310" fill="#d8b4fe" font-size="11" font-weight="700">🔍 Isolation Forest</text>
  <text x="568" y="330" fill="#94a3b8" font-size="10">• Detección de anomalías</text>
  <text x="568" y="347" fill="#94a3b8" font-size="10">• Fallas en electrodos</text>
  <text x="568" y="364" fill="#94a3b8" font-size="10">• Deriva de sensores</text>
  <text x="568" y="385" fill="#f59e0b" font-size="10" font-weight="600">• Filtro anti-ruido</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="740" y1="270" x2="780" y2="270" stroke="#a855f7" stroke-width="3" stroke-dasharray="4"/>
  <polygon points="780,265 790,270 780,275" fill="#a855f7"/>

  <!-- Step 4: Output & Actionable Recommendations -->
  <rect x="790" y="110" width="170" height="320" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="790" y="110" width="170" height="42" rx="12" fill="#065f46"/>
  <text x="875" y="137" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">4. DIAGNÓSTICO &amp; SCORE</text>

  <rect x="805" y="170" width="140" height="60" rx="8" fill="#0f172a"/>
  <text x="815" y="190" fill="#94a3b8" font-size="10">SCORE DE SALUD</text>
  <text x="815" y="218" fill="#10b981" font-size="24" font-weight="700">0 - 100%</text>

  <text x="805" y="255" fill="#a7f3d0" font-size="11" font-weight="600">🩺 Diagnósticos:</text>
  <text x="805" y="275" fill="#94a3b8" font-size="10">• Óptimo</text>
  <text x="805" y="292" fill="#94a3b8" font-size="10">• Estrés Hídrico</text>
  <text x="805" y="309" fill="#94a3b8" font-size="10">• Déficit Nutricional</text>
  <text x="805" y="326" fill="#94a3b8" font-size="10">• Toxicidad NPK</text>
  <text x="805" y="343" fill="#94a3b8" font-size="10">• Riesgo Patógenos</text>

  <rect x="805" y="365" width="140" height="50" rx="6" fill="#065f46"/>
  <text x="815" y="383" fill="#ecfdf5" font-size="10" font-weight="700">✓ Acción Correctiva</text>
  <text x="815" y="401" fill="#a7f3d0" font-size="9">Dosificación sugerida</text>
</svg>