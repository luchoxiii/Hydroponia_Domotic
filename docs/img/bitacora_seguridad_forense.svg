<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#0b1120; font-family:'Segoe UI', Roboto, -apple-system, sans-serif;">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#06b6d4" flood-opacity="0.45"/>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.45"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Title & Subtitle -->
  <text x="500" y="42" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="1">ARQUITECTURA DE AUDITORÍA FORENSE CIFRADA</text>
  <text x="500" y="68" fill="#94a3b8" font-size="13" text-anchor="middle">Cifrado Militar AES-256 + HMAC y Encadenamiento Criptográfico de Bloques SHA-256</text>

  <!-- Top Security Badges -->
  <g transform="translate(180, 85)">
    <rect x="0" y="0" width="190" height="34" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <text x="95" y="22" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">🛡️ Cifrado AES-256 CBC</text>
  </g>
  <g transform="translate(405, 85)">
    <rect x="0" y="0" width="190" height="34" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#glow-green)"/>
    <text x="95" y="22" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">🔗 Hash Chaining SHA-256</text>
  </g>
  <g transform="translate(630, 85)">
    <rect x="0" y="0" width="190" height="34" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="95" y="22" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">✍️ Firma Digital HMAC</text>
  </g>

  <!-- BLOCK 1 (EVENT N-1) -->
  <g transform="translate(60, 140)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="260" height="230" rx="12" fill="url(#blockGrad)" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 248 0 C 254.63 0 260 5.37 260 12 L 260 38 L 0 38 Z" fill="#1e293b"/>
    <circle cx="20" cy="19" r="6" fill="#10b981"/>
    <text x="35" y="24" fill="#f8fafc" font-size="13" font-weight="700">BLOQUE #041</text>
    <text x="245" y="24" fill="#94a3b8" font-size="10" text-anchor="end">14:22:10 UTC</text>

    <text x="18" y="62" fill="#38bdf8" font-size="11" font-weight="600">TIPO: TELEMETRIA_IOT</text>
    <text x="18" y="80" fill="#94a3b8" font-size="10">Dispositivo: ESP32 Canal A</text>
    <text x="18" y="96" fill="#94a3b8" font-size="10">Cultivo: Lechugas NFT Canal 1</text>

    <!-- Payload box -->
    <rect x="15" y="110" width="230" height="48" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="128" fill="#a7f3d0" font-family="Courier, monospace" font-size="10">pH: 6.05 | EC: 1.18 mS</text>
    <text x="25" y="146" fill="#a7f3d0" font-family="Courier, monospace" font-size="10">Temp: 22.4°C | Agua: 84%</text>

    <!-- Hashes -->
    <text x="18" y="176" fill="#64748b" font-size="9" font-family="Courier, monospace">PREV_HASH:</text>
    <text x="18" y="190" fill="#94a3b8" font-size="9" font-family="Courier, monospace">d8f1e29a...04bc</text>
    <text x="18" y="206" fill="#38bdf8" font-size="9" font-family="Courier, monospace">BLOCK_HASH:</text>
    <text x="18" y="220" fill="#38bdf8" font-size="9" font-family="Courier, monospace" font-weight="700">7a4e9b21...fa88</text>
  </g>

  <!-- LINK 1 -> 2 (LASER CONNECTION) -->
  <g transform="translate(320, 240)">
    <line x1="0" y1="15" x2="60" y2="15" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="60,15 50,9 50,21" fill="#0ea5e9"/>
    <circle cx="30" cy="15" r="9" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
    <text x="30" y="18" fill="#38bdf8" font-size="9" text-anchor="middle" font-weight="700">SHA</text>
  </g>

  <!-- BLOCK 2 (EVENT N) -->
  <g transform="translate(380, 140)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="260" height="230" rx="12" fill="url(#blockGrad)" stroke="#0ea5e9" stroke-width="2"/>
    <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 248 0 C 254.63 0 260 5.37 260 12 L 260 38 L 0 38 Z" fill="#0369a1"/>
    <circle cx="20" cy="19" r="6" fill="#38bdf8"/>
    <text x="35" y="24" fill="#ffffff" font-size="13" font-weight="700">BLOQUE #042</text>
    <text x="245" y="24" fill="#bae6fd" font-size="10" text-anchor="end">14:25:00 UTC</text>

    <text x="18" y="62" fill="#fbbf24" font-size="11" font-weight="600">TIPO: ALERTA_FISIOLOGICA</text>
    <text x="18" y="80" fill="#94a3b8" font-size="10">Nivel: CRITICA (Automática)</text>
    <text x="18" y="96" fill="#94a3b8" font-size="10">Disparo: pH Alto &gt; 6.50</text>

    <!-- Payload box -->
    <rect x="15" y="110" width="230" height="48" rx="6" fill="#0b1120" stroke="#0369a1" stroke-width="1"/>
    <text x="25" y="128" fill="#fde68a" font-family="Courier, monospace" font-size="10">pH registrado: 7.15</text>
    <text x="25" y="146" fill="#fde68a" font-family="Courier, monospace" font-size="10">Notificado: Telegram + DC</text>

    <!-- Hashes -->
    <text x="18" y="176" fill="#38bdf8" font-size="9" font-family="Courier, monospace">PREV_HASH (Bloque 041):</text>
    <text x="18" y="190" fill="#38bdf8" font-size="9" font-family="Courier, monospace">7a4e9b21...fa88</text>
    <text x="18" y="206" fill="#10b981" font-size="9" font-family="Courier, monospace">BLOCK_HASH:</text>
    <text x="18" y="220" fill="#10b981" font-size="9" font-family="Courier, monospace" font-weight="700">c319e04f...b712</text>
  </g>

  <!-- LINK 2 -> 3 (LASER CONNECTION) -->
  <g transform="translate(640, 240)">
    <line x1="0" y1="15" x2="60" y2="15" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="60,15 50,9 50,21" fill="#10b981"/>
    <circle cx="30" cy="15" r="9" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="30" y="18" fill="#34d399" font-size="9" text-anchor="middle" font-weight="700">SHA</text>
  </g>

  <!-- BLOCK 3 (EVENT N+1) -->
  <g transform="translate(700, 140)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="240" height="230" rx="12" fill="url(#blockGrad)" stroke="#10b981" stroke-width="2" filter="url(#glow-green)"/>
    <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 228 0 C 234.63 0 240 5.37 240 12 L 240 38 L 0 38 Z" fill="#065f46"/>
    <circle cx="20" cy="19" r="6" fill="#34d399"/>
    <text x="35" y="24" fill="#ffffff" font-size="13" font-weight="700">BLOQUE #043</text>
    <text x="225" y="24" fill="#a7f3d0" font-size="10" text-anchor="end">14:26:15 UTC</text>

    <text x="18" y="62" fill="#ef4444" font-size="11" font-weight="600">TIPO: ELIMINAR_CULTIVO</text>
    <text x="18" y="80" fill="#94a3b8" font-size="10">Acción: Baja Transaccional</text>
    <text x="18" y="96" fill="#94a3b8" font-size="10">Hardware: Desvinculado OK</text>

    <!-- Payload box -->
    <rect x="15" y="110" width="210" height="48" rx="6" fill="#0b1120" stroke="#047857" stroke-width="1"/>
    <text x="25" y="128" fill="#fca5a5" font-family="Courier, monospace" font-size="10">Cultivo ID #4 removido</text>
    <text x="25" y="146" fill="#fca5a5" font-family="Courier, monospace" font-size="10">Auditoría ACID: Commit</text>

    <!-- Hashes -->
    <text x="18" y="176" fill="#10b981" font-size="9" font-family="Courier, monospace">PREV_HASH (Bloque 042):</text>
    <text x="18" y="190" fill="#10b981" font-size="9" font-family="Courier, monospace">c319e04f...b712</text>
    <text x="18" y="206" fill="#34d399" font-size="9" font-family="Courier, monospace">BLOCK_HASH:</text>
    <text x="18" y="220" fill="#34d399" font-size="9" font-family="Courier, monospace" font-weight="700">92ff038e...11aa</text>
  </g>

  <!-- Bottom Verification Panel (Panel de Verificación en 1 Clic) -->
  <g transform="translate(60, 395)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="880" height="95" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="35" cy="48" r="18" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="35" y="54" fill="#ffffff" font-size="18" text-anchor="middle" font-weight="700">✓</text>
    
    <text x="70" y="38" fill="#ffffff" font-size="14" font-weight="700">VALIDADOR CRIPTOGRÁFICO INTEGRADO EN LA WEB (/bitacora)</text>
    <text x="70" y="58" fill="#94a3b8" font-size="11">Si cualquier atacante o proceso externo modifica 1 solo byte en <tspan fill="#38bdf8">data/bitacora_cifrada.enc</tspan>, la cadena de hashes se rompe de inmediato.</text>
    <text x="70" y="76" fill="#6ee7b7" font-size="11" font-weight="600">Resultado del Algoritmo de Verificación: [ESTADO: ÍNTEGRO | 100% BLOQUES VÁLIDOS | FIRMA HMAC CONFIRMADA]</text>

    <!-- Button mockup -->
    <rect x="730" y="30" width="130" height="36" rx="8" fill="#10b981"/>
    <text x="795" y="53" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">🔍 Auditar en Vivo</text>
  </g>
</svg>